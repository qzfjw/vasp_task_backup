interface:
  display_name: "VASP Task Backup"
  short_description: "增量镜像 VASP 任务并登记 VaspLog.xlsx"
  default_prompt: "使用 $vasp-task-backup 扫描指定服务器路径，把包含 INCAR、POSCAR 的 VASP 任务按原绝对路径镜像到 yang 的 /home/bak。OUTCAR 可以缺失；如果存在，则必须正常结束且不含明确致命错误。跳过未修改任务，修改过的任务重新备份，并把任务信息写入 /home/bak/VaspLog.xlsx。先展示 DryRun 计划，得到用户确认后再备份。"
